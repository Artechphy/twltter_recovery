name: Harness CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spec:
    name: harness/spec
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m harness lint --structure-only
      - name: Audit full task and closure evidence
        run: python -m harness lint
  selftest:
    name: harness/selftest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
  merge:
    name: harness/merge
    needs: [spec, selftest]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verify native harness Actions identity
        run: python -m harness ci-context --output .harness/reports/github-context.json
      - name: Verify event checkout, ancestry, and publication scope
        run: python ci/verify_checkout.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: checkout-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .harness/reports/github-checkout.json
            .harness/reports/github-context.json
          include-hidden-files: true
          if-no-files-found: error
